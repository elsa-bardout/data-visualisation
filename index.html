<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Turn spreadsheet data into editable charts and maps. Explore sample data, customise your chart, and export SVG, PNG or HTML."
    />
    <title>Data visualisation</title>
    <link rel="stylesheet" href="assets/app.css" />
    <script defer="" src="assets/shared.js"></script>
    <script defer src="assets/samples.js"></script>
    <script defer="" src="assets/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#data-heading">Skip to data</a>
    <header class="top">
      <div class="topin shell">
        <div class="brand">
          <strong id="activeTitle">Sankey builder</strong
          ><a
            class="credit"
            href="https://uk.linkedin.com/in/elsabardout"
            target="_blank"
            rel="noopener"
            >Made by Elsa Bardout</a
          >
        </div>
        <nav class="modes" role="tablist" aria-label="Chart type">
          <div class="indicator"></div>
          <button
            class="mode active"
            data-mode="sankey"
            title="Sankey builder"
            id="tab-sankey"
            role="tab"
            aria-label="Sankey builder"
            aria-controls="panel-sankey"
          >
            <svg viewBox="0 0 24 24">
              <rect x="2.5" y="4" width="5" height="5"></rect>
              <rect x="16.5" y="3" width="5" height="5"></rect>
              <rect x="16.5" y="16" width="5" height="5"></rect>
              <path d="M7.5 6.5H16.5M7.5 6.5C13 6.5 11 18.5 16.5 18.5"></path>
            </svg></button
          ><button
            class="mode"
            data-mode="donut"
            title="Donut chart builder"
            id="tab-donut"
            role="tab"
            aria-label="Donut chart builder"
            aria-controls="panel-donut"
          >
            <svg viewBox="0 0 24 24">
              <path d="M12 3a9 9 0 1 0 9 9h-6a3 3 0 1 1-3-3z"></path>
              <path d="M14 3.2A9 9 0 0 1 20.8 10H15a3 3 0 0 0-1-1z"></path>
            </svg></button
          ><button
            class="mode"
            data-mode="bar"
            title="Bar chart builder"
            id="tab-bar"
            role="tab"
            aria-label="Bar chart builder"
            aria-controls="panel-bar"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 20V9h4v11M10 20V4h4v16M16 20v-7h4v7M2 20h20"></path>
            </svg></button
          ><button
            class="mode"
            data-mode="line"
            title="Line chart builder"
            id="tab-line"
            role="tab"
            aria-label="Line chart builder"
            aria-controls="panel-line"
          >
            <svg viewBox="0 0 24 24">
              <path d="M3 18 9 11l4 3 8-9M3 20h18"></path>
            </svg></button
          ><button
            class="mode"
            data-mode="scatter"
            title="Scatter plot builder"
            id="tab-scatter"
            role="tab"
            aria-label="Scatter plot builder"
            aria-controls="panel-scatter"
          >
            <svg viewBox="0 0 24 24">
              <path d="M3 3v17h18"></path>
              <circle cx="8" cy="14" r="1.5"></circle>
              <circle cx="12" cy="9" r="1.5"></circle>
              <circle cx="16" cy="12" r="1.5"></circle>
              <circle cx="19" cy="6" r="1.5"></circle>
            </svg></button
          ><button
            class="mode"
            data-mode="map"
            title="Map builder"
            id="tab-map"
            role="tab"
            aria-label="Map builder"
            aria-controls="panel-map"
          >
            <svg viewBox="0 0 24 24">
              <path d="M9 18 3 21V6l6-3 6 3 6-3v15l-6 3-6-3Z"></path>
              <path d="M9 3v15M15 6v15"></path>
            </svg>
          </button>
        </nav>
      </div>
    </header>
    <main class="page">
      <section class="sharedData shell">
        <div class="sharedHead">
          <div>
            <h1 id="data-heading" tabindex="-1">Data</h1>
            <p>
              Paste an Excel range into the first cell. The selected chart will
              interpret the same table automatically.
            </p>
          </div>
          <div class="data-actions">
            <button
              id="sample"
              type="button"
              title="Load demonstration data (fictional values)"
            >
              Try sample data</button
            ><button
              id="clear"
              class="sharedReset"
              title="Reset everything"
              aria-label="Clear data and reset charts"
            >
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              >
                <path
                  d="M4 7h16M9 7V4h6v3m-9 0 1 13h10l1-13M10 11v5m4-5v5"
                ></path>
              </svg>
            </button>
          </div>
        </div>
        <div class="sharedGridbox">
          <table
            id="grid"
            class="sharedGrid"
            aria-label="Editable source data"
          ></table>
        </div>
        <div class="sharedHint">
          The data stays in place when you switch chart type. If the structure
          is unsuitable, the selected chart will explain what it needs.
        </div>
        <div id="diagnostics" class="diagnostics" role="status"></div>
        <div id="notice" class="sr-only" role="status" aria-live="polite"></div>
      </section>
      <section class="stage" aria-label="Chart preview">
        <iframe
          class="panel"
          id="panel-sankey"
          data-mode="sankey"
          role="tabpanel"
          aria-labelledby="tab-sankey"
          title="sankey builder"
          data-src="builders/sankey.html"
        ></iframe
        ><iframe
          class="panel"
          id="panel-donut"
          data-mode="donut"
          role="tabpanel"
          aria-labelledby="tab-donut"
          title="donut builder"
          data-src="builders/donut.html"
        ></iframe
        ><iframe
          class="panel"
          id="panel-bar"
          data-mode="bar"
          role="tabpanel"
          aria-labelledby="tab-bar"
          title="bar builder"
          data-src="builders/bar.html"
        ></iframe
        ><iframe
          class="panel"
          id="panel-line"
          data-mode="line"
          role="tabpanel"
          aria-labelledby="tab-line"
          title="line builder"
          data-src="builders/line.html"
        ></iframe
        ><iframe
          class="panel"
          id="panel-scatter"
          data-mode="scatter"
          role="tabpanel"
          aria-labelledby="tab-scatter"
          title="scatter builder"
          data-src="builders/scatter.html"
        ></iframe
        ><iframe
          class="panel"
          id="panel-map"
          data-mode="map"
          role="tabpanel"
          aria-labelledby="tab-map"
          title="map builder"
          data-src="builders/map.html"
        ></iframe>
      </section>
    </main>
  </body>
</html>
