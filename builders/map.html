<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta content="width=device-width" name="viewport" />
    <title>Map builder</title>
    <link href="../assets/vendor/leaflet.css" rel="stylesheet" />
    <script src="../assets/vendor/leaflet.js"></script>
    <link rel="stylesheet" href="../assets/map.css" />
    <link rel="stylesheet" href="../assets/builder.css" />
    <script src="../assets/shared.js"></script>
    <script src="../assets/export.js"></script>
  </head>
  <body>
    <div class="app">
      <section class="card">
        <div class="titlebar">
          <input
            aria-label="Map title"
            class="title"
            id="title"
            value=""
            placeholder="Enter title here"
            autocomplete="off"
          />
          <div class="menuWrap downloadWrap">
            <button aria-label="Download" class="btn primary" id="download">
              <svg
                fill="none"
                height="14"
                stroke="currentColor"
                stroke-width="2"
                style="margin-right: 6px"
                viewbox="0 0 24 24"
                width="14"
              >
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14"></path></svg
              >Download
              <svg
                fill="none"
                height="12"
                stroke="currentColor"
                stroke-width="1.6"
                viewbox="0 0 12 12"
                width="12"
              >
                <path d="m3 4.5 3 3 3-3"></path>
              </svg>
            </button>
            <div class="menu" id="downloadMenu">
              <button data-download="svg">SVG shapes and labels</button
              ><button data-download="png">PNG image</button
              ><button data-download="html">Interactive HTML</button>
            </div>
          </div>
        </div>
        <div class="toolbar">
          <div class="toolbarRow toolbarSliders">
            <label class="ctrl"
              >Scale<input
                id="scale"
                max="150"
                min="70"
                type="range"
                value="100"
              /><b id="scaleV">100%</b></label
            ><label class="ctrl isHidden" id="fillOpacityControl"
              >Fill opacity<input
                id="opacity"
                max="100"
                min="0"
                type="range"
                value="88"
              /><b id="opacityV">88%</b></label
            ><label class="ctrl" id="mapOpacityControl"
              >Map opacity<input
                id="mapOpacity"
                max="100"
                min="0"
                type="range"
                value="50"
              /><b id="mapOpacityV">50%</b></label
            >
          </div>
          <div class="toolbarRow toolbarActions">
            <button class="btn active" id="mapModeBtn">Full map</button>
            <div class="menuWrap" id="pinControl">
              <button class="btn" id="pinBtn">
                Pins: Map pins
                <svg
                  fill="none"
                  height="12"
                  stroke="currentColor"
                  stroke-width="1.6"
                  viewbox="0 0 12 12"
                  width="12"
                >
                  <path d="m3 4.5 3 3 3-3"></path>
                </svg>
              </button>
              <div class="menu" id="pinMenu">
                <button data-pin="dot"><i class="pinPreview"></i>Dots</button
                ><button data-pin="bubble">
                  <i class="pinPreview bubble"></i>Bubbles</button
                ><button class="active" data-pin="marker">
                  <i class="pinPreview marker"></i>Map pins</button
                ><button data-pin="ring">
                  <i class="pinPreview ring"></i>Rings</button
                ><button data-pin="square">
                  <i class="pinPreview square"></i>Squares</button
                ><button data-pin="diamond">
                  <i class="pinPreview diamond"></i>Diamonds
                </button>
              </div>
            </div>
            <label class="colourSetting"
              >Outline
              <input
                id="outlineColour"
                type="color"
                value="#ffffff"
                aria-label="Map outline colour" /></label
            ><label class="colourSetting"
              >Labels
              <input
                id="labelColour"
                type="color"
                value="#17212b"
                aria-label="Map label colour" /></label
            ><button class="btn" id="themeBtn" type="button">Dark map</button
            ><button class="btn" id="labelBtn">Labels outside</button>
            <div class="menuWrap colourWrap">
              <button class="btn" id="colourByBtn">
                Colour by: Automatic
                <svg
                  fill="none"
                  height="12"
                  stroke="currentColor"
                  stroke-width="1.6"
                  viewbox="0 0 12 12"
                  width="12"
                >
                  <path d="m3 4.5 3 3 3-3"></path>
                </svg>
              </button>
              <div class="menu" id="colourByMenu"></div>
            </div>
            <button class="btn active" id="valuesBtn">Values</button
            ><button class="btn active" id="detailsBtn">Details</button>
          </div>
        </div>
        <div class="legend" id="legend"></div>
        <div class="mapWrap">
          <div class="map" id="map"></div>
          <div class="empty" id="empty" style="">
            The map visualisation will appear here.
          </div>
          <div class="status" id="status"></div>
        </div>
      </section>
    </div>
    <div class="tip" id="tip" role="status"></div>
    <div class="colourPop" id="colourPop">
      <input class="hex" id="hex" maxlength="7" /><input
        class="nativeColour"
        id="nativeColour"
        type="color"
      />
    </div>

    <script src="../assets/map.js"></script>
    <script src="../assets/builder.js"></script>
  </body>
</html>
