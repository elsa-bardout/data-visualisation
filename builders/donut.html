<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width" />
    <title>Donut chart builder</title>
    <script src="../assets/vendor/d3.min.js"></script>
    <link rel="stylesheet" href="../assets/donut.css" />
    <link rel="stylesheet" href="../assets/builder.css" />
    <script src="../assets/shared.js"></script>
    <script src="../assets/export.js"></script>
  </head>
  <body>
    <div class="app">
      <div aria-hidden="true" style="display: none">
        <button id="reset"></button>
        <table id="grid"></table>
      </div>
      <div id="status" class="status"></div>
      <section class="card chart">
        <div class="titlebar">
          <input
            id="diagramTitle"
            class="diagramTitle"
            value=""
            placeholder="Enter title here"
            autocomplete="off"
          />
          <div class="menuWrap">
            <button
              id="share"
              class="btn primary"
              disabled
              aria-label="Download"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                style="vertical-align: -2px; margin-right: 6px"
              >
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" /></svg
              >Download
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path d="m3 4.5 3 3 3-3" />
              </svg>
            </button>
            <div id="menu" class="menu">
              <button data-x="svg">Editable SVG</button
              ><button data-x="png">PNG image</button
              ><button data-x="html">Interactive HTML</button>
            </div>
          </div>
        </div>
        <div class="bar">
          <div class="controls">
            <div class="ctrl">
              Size<input
                id="size"
                type="range"
                min="260"
                max="760"
                step="20"
                value="380"
              /><b id="sizev">380</b>
            </div>
            <div class="ctrl">
              Spacing<input
                id="p"
                type="range"
                min="0"
                max="2"
                step="0.1"
                value="0.5"
              /><b id="pv">0.5</b>
            </div>
            <div class="ctrl">
              Hole<input
                id="hole"
                type="range"
                min="25"
                max="80"
                value="58"
              /><b id="holev">58%</b>
            </div>
            <div id="periodCtrl" class="ctrl" style="display: none">
              Period<input id="period" type="range" /><b id="periodLabel"></b>
            </div>
          </div>
          <div class="arrange">
            <button id="typeToggle" class="btn active">Donut</button
            ><button id="labelToggle" class="btn active">Value + %</button>
          </div>
        </div>
        <div id="legend" class="legend"></div>
        <div class="canvas">
          <div id="empty" class="empty">The donut chart will appear here.</div>
          <svg id="svg" style="display: none"></svg>
        </div>
      </section>
    </div>
    <div id="tip" class="tip"></div>
    <div id="colourPop" class="colourPop">
      <input id="hex" class="hex" maxlength="7" /><input
        id="nativeColour"
        class="nativeColour"
        type="color"
      />
    </div>
    <script src="../assets/donut.js"></script>
    <script src="../assets/builder.js"></script>
  </body>
</html>
