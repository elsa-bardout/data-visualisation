<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Scatter plot builder</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="../assets/scatter.css" />
    <link rel="stylesheet" href="../assets/builder.css" />
    <script src="../assets/shared.js"></script>
    <script src="../assets/export.js"></script>
  </head>
  <body>
    <div class="app">
      <div aria-hidden="true" style="display: none">
        <button id="reset"></button>
        <table id="grid"></table>
      </div>
      <div id="status" class="status"></div>
      <section class="card chart">
        <div class="titlebar">
          <input
            id="diagramTitle"
            class="diagramTitle"
            value="Enter title here"
          />
          <div class="menuWrap">
            <button
              id="share"
              class="btn primary"
              disabled
              aria-label="Download"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                style="vertical-align: -2px; margin-right: 6px"
              >
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" /></svg
              >Download
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path d="m3 4.5 3 3 3-3" />
              </svg>
            </button>
            <div id="menu" class="menu">
              <button data-x="svg">Editable SVG</button
              ><button data-x="png">PNG image</button
              ><button data-x="html">Interactive HTML</button>
            </div>
          </div>
        </div>
        <div class="bar">
          <div class="controls">
            <div class="ctrl">
              Width<input
                id="w"
                type="range"
                min="420"
                max="1800"
                step="20"
                value="700"
              /><b id="wv">700</b>
            </div>
            <div class="ctrl">
              Height<input
                id="h"
                type="range"
                min="300"
                max="1100"
                step="20"
                value="400"
              /><b id="hv">400</b>
            </div>
            <div class="ctrl">
              Points<input id="ps" type="range" min="2" max="18" value="6" /><b
                id="psv"
                >6</b
              >
            </div>
            <div class="ctrl">
              Opacity<input
                id="op"
                type="range"
                min="20"
                max="100"
                step="5"
                value="80"
              /><b id="opv">80%</b>
            </div>
            <div id="bubbleCtrl" class="ctrl" style="display: none">
              Bubble scale<input
                id="bs"
                type="range"
                min="20"
                max="250"
                step="10"
                value="100"
              /><b id="bsv">100%</b>
            </div>
            <div id="periodCtrl" class="ctrl" style="display: none">
              Period<input id="period" type="range" /><b id="periodLabel"></b>
            </div>
          </div>
          <div class="arrange">
            <button id="labels" class="btn" style="display: none">Labels</button
            ><button id="trend" class="btn" style="display: none">
              Trend lines</button
            ><button id="zero" class="btn">Start at zero</button
            ><button id="equal" class="btn">Equal axes</button>
          </div>
        </div>
        <div id="legend" class="legend"></div>
        <div class="canvas">
          <div id="empty" class="empty">The scatter plot will appear here.</div>
          <svg id="svg" style="display: none"></svg>
        </div>
      </section>
    </div>
    <div id="tip" class="tip"></div>
    <div id="colourPop" class="colourPop">
      <input id="hex" class="hex" maxlength="7" /><input
        id="nativeColour"
        class="nativeColour"
        type="color"
      />
    </div>
    <script src="../assets/scatter.js"></script>
    <script src="../assets/builder.js"></script>
  </body>
</html>
