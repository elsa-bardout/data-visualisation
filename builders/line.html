<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width" />
    <title>Line chart builder</title>
    <script src="../assets/vendor/d3.min.js"></script>
    <link rel="stylesheet" href="../assets/line.css" />
    <link rel="stylesheet" href="../assets/builder.css" />
    <script src="../assets/shared.js"></script>
    <script src="../assets/export.js"></script>
  </head>
  <body>
    <div class="app">
      <div aria-hidden="true" style="display: none">
        <button id="reset"></button>
        <table id="grid"></table>
      </div>
      <div id="status" class="status"></div>
      <section class="card chart">
        <div class="titlebar">
          <input
            id="diagramTitle"
            class="diagramTitle"
            value=""
            placeholder="Enter title here"
            autocomplete="off"
          />
          <div class="menuWrap">
            <button
              id="share"
              class="btn primary"
              disabled
              aria-label="Download"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                style="vertical-align: -2px; margin-right: 6px"
              >
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" /></svg
              >Download
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path d="m3 4.5 3 3 3-3" />
              </svg>
            </button>
            <div id="menu" class="menu">
              <button data-x="svg">Editable SVG</button
              ><button data-x="png">PNG image</button
              ><button data-x="html">Interactive HTML</button>
            </div>
          </div>
        </div>
        <div class="bar">
          <div class="controls">
            <div class="ctrl">
              Width<input
                id="w"
                type="range"
                min="320"
                max="2200"
                step="20"
                value="760"
              /><b id="wv">760</b>
            </div>
            <div class="ctrl">
              Height<input
                id="h"
                type="range"
                min="220"
                max="1400"
                step="20"
                value="380"
              /><b id="hv">380</b>
            </div>
            <div class="ctrl">
              Line<input
                id="lw"
                type="range"
                min="0.5"
                max="8"
                step=".5"
                value="2"
              /><b id="lwv">2</b>
            </div>
            <div class="ctrl">
              Points<input id="ps" type="range" min="0" max="9" value="3" /><b
                id="psv"
                >3</b
              >
            </div>
          </div>
          <div class="arrange">
            <div class="menuWrap">
              <button id="curveBtn" class="curveBtn">Smooth</button>
              <div id="curveMenu" class="menu">
                <button data-curve="linear">Straight</button
                ><button data-curve="monotone">Smooth</button
                ><button data-curve="step">Step</button>
              </div>
            </div>
            <button id="area" class="btn">Area</button
            ><button id="labels" class="btn">Values</button
            ><button id="zero" class="btn">Start at zero</button>
          </div>
        </div>
        <div id="legend" class="legend"></div>
        <div class="canvas">
          <div id="empty" class="empty">The line chart will appear here.</div>
          <svg id="svg" style="display: none"></svg>
        </div>
      </section>
    </div>
    <div id="tip" class="tip"></div>
    <div id="colourPop" class="colourPop">
      <input id="hex" class="hex" maxlength="7" /><input
        id="nativeColour"
        class="nativeColour"
        type="color"
      />
    </div>
    <script src="../assets/line.js"></script>
    <script src="../assets/builder.js"></script>
  </body>
</html>
