<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>Sankey builder</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <link rel="stylesheet" href="../assets/sankey.css" />
    <link rel="stylesheet" href="../assets/builder.css" />
    <script src="../assets/shared.js"></script>
    <script src="../assets/export.js"></script>
  </head>
  <body>
    <div class="app">
      <div aria-hidden="true" style="display: none">
        <button id="reset"></button>
        <table id="grid"></table>
      </div>
      <div id="status" class="status"></div>
      <section class="card chart">
        <div class="titlebar">
          <input
            id="diagramTitle"
            class="diagramTitle"
            value="Enter title here"
            aria-label="Diagram title"
          />
          <div class="menuWrap">
            <button
              id="share"
              class="btn primary"
              disabled
              aria-label="Download"
            >
              <svg
                width="14"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                style="vertical-align: -2px; margin-right: 6px"
              >
                <path d="M12 3v12m0 0 5-5m-5 5-5-5M5 21h14" /></svg
              >Download
              <svg
                width="12"
                height="12"
                viewBox="0 0 12 12"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
              >
                <path d="m3 4.5 3 3 3-3" />
              </svg>
            </button>
            <div id="menu" class="menu">
              <button data-x="svg">Editable SVG</button
              ><button data-x="png">PNG image</button
              ><button data-x="html">Interactive HTML</button>
            </div>
          </div>
        </div>
        <div class="bar">
          <div class="controls">
            <div class="ctrl">
              Width<input
                id="w"
                type="range"
                min="600"
                max="2200"
                step="20"
                value="1320"
              /><b id="wv">1320</b>
            </div>
            <div class="ctrl">
              Height<input
                id="h"
                type="range"
                min="360"
                max="1400"
                step="20"
                value="360"
              /><b id="hv">360</b>
            </div>
            <div class="ctrl">
              Spacing<input id="p" type="range" min="4" max="55" value="8" /><b
                id="pv"
                >8</b
              >
            </div>
            <div id="periodCtrl" class="ctrl" style="display: none">
              Period<input
                id="period"
                type="range"
                min="0"
                max="0"
                value="0"
              /><b id="periodLabel"></b>
            </div>
          </div>
          <div class="arrange">
            <button id="det" class="btn" disabled aria-describedby="detTip">
              Detangle
            </button>
          </div>
        </div>
        <div id="legend" class="legend"></div>
        <div class="canvas">
          <div id="empty" class="empty">The Sankey will appear here.</div>
          <svg id="svg" style="display: none"></svg>
        </div>
      </section>
    </div>
    <div id="tip" class="tip"></div>
    <div id="detTip" class="detTip" role="tooltip">
      Reorders the diagram to reduce crossed ribbons. You can also drag a bar,
      or drag a ribbon near either end, to reorder it manually.
    </div>
    <div id="colourPop" class="colourPop">
      <input id="hex" class="hex" maxlength="7" aria-label="Hex colour" /><input
        id="nativeColour"
        class="nativeColour"
        type="color"
        aria-label="Colour picker"
      />
    </div>
    <script src="../assets/sankey.js"></script>
    <script src="../assets/builder.js"></script>
  </body>
</html>
